# Source PointerCAD data remains authoritative. This builder only materializes
# a full-episode index under format/pointercad_rl/episodes.
source:
  name: "paramcad-addon"
  dataset_dir: "./data/smoke/dataset"
  split_filepath: "./data/smoke/train_val_test.json"
  prompt_variants:
    - exp

output_root: "./data/smoke/format/rl"
preprocessing_version: "episode-index-v1"
