run_id: "sft-05b-k3"
generator_version: "rollout-generator-v4-vectorized-predict"

# smoke
episodes_root: "/home/terbium/datasets/paramcad-addon/smoke/format/rl/episodes"
source_dataset_root: "/home/terbium/datasets/paramcad-addon/smoke/dataset"
output_root: "/home/terbium/datasets/paramcad-addon/smoke/format/rl/rollouts"

splits:
  - train
  - validation

model:
  base_model: "Qwen/Qwen2.5-0.5B-Instruct"
  checkpoint_path: "/home/terbium/PointerCADv2-RL/log/sft-checkpoints/addon-0.5B-model.pth"
  device: "cuda"
  dtype: "bfloat16"

generation:
  trajectories_per_episode: 3
  base_seed: 0
  # GPU actions are generated together across independent active trajectories.
  # Keep more CPU workers than batch slots so CAD execution/metrics can overlap
  # the next GPU batch.
  batch_size: 2
  cpu_workers_per_gpu: 2
  batch_wait_seconds: 0.2
  max_episode_steps: 64
  max_generation_steps: 1024
  max_input_length: 3072
  write_shard_size: 64
  max_episodes_per_split: null
  task_ids: null
  temperatures:
    plan: 1.0
    label: 1.0
    parameter: 1.0
    pointer: 1.0

execution:
  strict: true
  # Prevent OpenCascade workers from oversubscribing CPU cores internally.
  cpu_threads_per_worker: 1
  build_timeout_seconds: 300.0
  surf_u_samples: 32
  surf_v_samples: 32
  curv_u_samples: 32

metrics:
  version: "geometry-raw-v1"
  enabled:
    - iou
    - chamfer_distance
    - accuracy
    - f1
    - watertight
  chamfer_points: 8192

outputs:
  save_step: true
  save_mesh: true
