# smoke
training:
  output_dir: "./log/dpo"
  num_epochs: 1
  batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-5
  tau_learning_rate: 1.0e-6
  weight_decay: 0.01
  beta: 0.3
  label_smoothing: 0.0
  mixed_precision: "bf16"
  max_grad_norm: 1.0
  final_lr_factor: 0.0
  num_workers: 0
  prefetch_factor: 2
  pin_memory: false
  seed: 0
  log_interval: 1
  checkpoint_interval: 1000
  validation_interval: 1

# DPO scores the underlying model policy, not rollout sampling distributions.
scoring_temperatures:
  plan: 1.0
  label: 1.0
  parameter: 1.0
  pointer: 1.0
