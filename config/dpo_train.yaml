model:
  base_model: "Qwen/Qwen2.5-0.5B-Instruct"
  checkpoint_path: "/home/terbium/PointerCADv2-RL/log/sft-checkpoints/addon-0.5B-model.pth"
  max_length: 3072
  device: "cuda"
  dtype: "bfloat16"

dataset:
  episodes_root: "/home/terbium/datasets/paramcad-addon/smoke/format/rl/episodes"
  rollout_root: "/home/terbium/datasets/paramcad-addon/smoke/format/rl/rollouts/sft-05b-k2-20260804"
  preferences_root: "/home/terbium/datasets/paramcad-addon/smoke/format/rl/preferences/geometry-v1"


# "model" keeps a frozen SFT copy in memory. "cached" reads total_logp from
# rollouts/scores for checkpoint_hash and avoids loading a reference model.
reference:
  mode: "model"
  checkpoint_path: "/home/terbium/PointerCADv2-RL/log/sft-checkpoints/addon-0.5B-model.pth"
  checkpoint_hash: "sft-model-hash"

