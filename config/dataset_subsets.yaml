# The source dataset remains authoritative. Each selected model is kept whole:
# all of its step-level records stay together in their original split.
source:
  dataset_dir: "/path/to/pointercad/dataset"
  split_filepath: "/path/to/pointercad/train_val_test.json"
  prompt_variants:
    - abs
    - exp

profiles:
  # Small, self-contained dataset for local loader / episode / rollout checks.
  smoke:
    mode: smoke
    output_dir: "/path/to/subsets/pointercad-smoke"
    seed: 42
    materialization: copy
    max_sampling_attempts: 2000
    splits:
      train:
        num_chunks: 3
        models_per_chunk: 4
        requirements:
          min_multistep_models: 3
          min_fillet_models: 1
          min_chamfer_models: 1
          min_plain_models: 3
      validation:
        num_chunks: 2
        models_per_chunk: 4
        requirements:
          min_multistep_models: 2
          min_plain_models: 2

  # Roughly 15k SFT step records. Whole-model selection can cause a small
  # difference from the target, which the validator bounds with tolerance.
  train_small:
    mode: target_records
    output_dir: "/path/to/subsets/pointercad-train-15k"
    seed: 42
    # hardlink is space-efficient on one filesystem. Use copy for a portable
    # dataset, symlink for a lightweight view, or none to write only the split.
    materialization: hardlink
    target_step_records: 15000
    split_fractions:
      train: 0.90
      validation: 0.05
      test: 0.05
    record_tolerance: 100
